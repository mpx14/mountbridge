[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mountbridge"
version = "1.2.0"
description = "Network mount manager for XFCE / Debian — NFS, SMB and SSHFS with system keyring credential storage"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ben", email = "ben@mutefx.net" }]
keywords = ["nfs", "smb", "sshfs", "gtk", "xfce", "mount", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: System :: Filesystems",
]
requires-python = ">=3.10"
# PyGObject (gi) comes from apt (python3-gi); install with pipx --system-site-packages.
dependencies = [
    "keyring>=23",
    "SecretStorage>=3.3",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
mountbridge = "mountbridge.window:main"

[project.urls]
Homepage   = "https://github.com/mpx14/mountbridge"
Repository = "https://github.com/mpx14/mountbridge"
Issues     = "https://github.com/mpx14/mountbridge/issues"
Changelog  = "https://github.com/mpx14/mountbridge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["mountbridge*"]

[tool.setuptools.package-data]
mountbridge = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() must run before `from gi.repository import …`
"mountbridge/{window,widgets}.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
