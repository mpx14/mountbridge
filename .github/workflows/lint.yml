name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint + tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install tools
        run: pip install ruff pytest

      - name: Ruff
        run: ruff check mountbridge/ tests/ data/mountbridge-helper

      - name: Shellcheck
        run: shellcheck install.sh

      - name: Tests (GTK-free modules and the root helper)
        run: python -m pytest -q

      - name: Package builds
        run: pip install build && python -m build --sdist --wheel
